<!-- Firebase SDK: compat build works with the original plain HTML JavaScript -->
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<!-- Main Logic Script -->
<script>
// Public portal. Read-only Firestore listener. Admin credentials never appear here.
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "PASTE_MESSAGING_SENDER_ID",
  appId: "PASTE_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let participants = [];
function setSyncBadge(ok, label) {
  const badge = document.getElementById('sync-badge');
  badge.textContent = label;
  badge.className = 'text-xs font-normal px-2.5 py-0.5 rounded-full border ' +
     (ok ? 'bg-green-100 text-green-700 border-green-300' : 'bg-red-100 text-red-700 border-red-300');
}
        function renderLiveLeaderboard() {
            const sorted = [...participants].sort((a, b) => b.totalBowls - a.totalBowls);
            document.getElementById('total-participants-badge').textContent = `Total: ${sorted.length} Participants`;

            const podiumContainer = document.getElementById('podium-section');
            podiumContainer.innerHTML = '';

            const top3 = sorted.slice(0, 3);
            const podiumOrder = [top3[1], top3[0], top3[2]];

            const podiumConfig = [
                { rank: 2, badge: '🥈 2nd Place', bg: 'bg-gradient-to-b from-slate-50 to-slate-100', border: 'border-slate-300', text: 'text-slate-600', crown: '🥈' },
                { rank: 1, badge: '👑 Champion', bg: 'bg-gradient-to-b from-amber-50 to-yellow-100', border: 'border-amber-300', text: 'text-amber-600', crown: '👑' },
                { rank: 3, badge: '🥉 3rd Place', bg: 'bg-gradient-to-b from-orange-50 to-orange-100', border: 'border-orange-300', text: 'text-orange-600', crown: '🥉' }
            ];

            podiumOrder.forEach((item, index) => {
                if (!item) return;
                const conf = podiumConfig[index];

                const cardHtml = `
                    <div class="${conf.bg} rounded-3xl p-5 border-4 ${conf.border} shadow-card flex flex-col items-center text-center relative overflow-hidden bounce-hover ${conf.rank === 1 ? 'md:-translate-y-2' : ''}">
                        <div class="absolute -right-6 -top-6 text-6xl opacity-10 font-bold select-none">#${conf.rank}</div>
                        <div class="text-3xl mb-1 ${conf.rank === 1 ? 'crown-glow' : ''}">${conf.crown}</div>
                        <span class="text-xs font-bold ${conf.text} bg-white/80 px-3 py-0.5 rounded-full border border-current mb-2">
                            ${conf.badge}
                        </span>

                        <h4 class="font-fun text-xl text-gray-800 tracking-wide">${escapeHtml(item.name)}</h4>
                        <p class="text-xs text-gray-500 mb-3">No. ${escapeHtml(item.table)} ${item.ig ? '| @' + escapeHtml(item.ig) : ''}</p>

                        <div class="w-full bg-white/80 rounded-2xl p-3 border border-gray-200/60 shadow-inner text-center">
                            <div class="text-3xl font-black text-macaron-accent font-fun">${item.totalBowls} <span class="text-sm font-normal">Bowls</span></div>
                            <div class="text-[10px] text-gray-400 uppercase font-bold">5-Min Bowl Total</div>
                        </div>
                    </div>
                `;
                podiumContainer.insertAdjacentHTML('beforeend', cardHtml);
            });

            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = '';

            if (sorted.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-400 font-bold">
                        <p class="text-3xl mb-2">🥣</p>
                        No participants registered yet. Admin can log in to add contestants!
                    </div>
                `;
                return;
            }

            sorted.forEach((item, index) => {
                const rank = index + 1;
                let rankBadgeClass = 'bg-gray-100 text-gray-600';
                if (rank === 1) rankBadgeClass = 'bg-yellow-400 text-white font-extrabold shadow-sm';
                else if (rank === 2) rankBadgeClass = 'bg-slate-300 text-white font-extrabold shadow-sm';
                else if (rank === 3) rankBadgeClass = 'bg-amber-600 text-white font-extrabold shadow-sm';

                const rowHtml = `
                    <div class="rank-card bg-macaron-cream/40 hover:bg-macaron-softPink/40 rounded-2xl p-4 border-2 border-macaron-softPink flex flex-col sm:grid sm:grid-cols-12 gap-3 items-center transition-all">
                        <div class="sm:col-span-2 flex items-center gap-2 justify-center">
                            <span class="w-8 h-8 rounded-full ${rankBadgeClass} flex items-center justify-center text-sm font-bold">
                                ${rank}
                            </span>
                            ${rank <= 3 ? '<span class="text-xs text-amber-500 font-bold">TOP ' + rank + '</span>' : ''}
                        </div>

                        <div class="sm:col-span-6 text-center sm:text-left">
                            <div class="font-bold text-gray-800 text-base">${escapeHtml(item.name)}</div>
                            <div class="text-xs text-gray-400 flex items-center justify-center sm:justify-start gap-2">
                                <span><i class="fa-solid fa-hashtag text-macaron-pink"></i> No. ${escapeHtml(item.table)}</span>
                                ${item.ig ? '<span><i class="fa-brands fa-instagram text-pink-500"></i> @' + escapeHtml(item.ig) + '</span>' : ''}
                            </div>
                        </div>

                        <div class="sm:col-span-4 text-center sm:text-right sm:pr-6">
                            <span class="text-3xl font-black text-macaron-accent font-fun">${item.totalBowls}</span>
                            <span class="text-xs text-gray-500 font-bold"> Bowls</span>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&#034;")
                .replace(/'/g, "&#039;");
        }


renderLiveLeaderboard();
db.collection('participants').onSnapshot(snapshot => {
  participants = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderLiveLeaderboard();
  setSyncBadge(true,'Live Syncing');
}, err => {
  console.error('Live leaderboard sync failed:',err);
  setSyncBadge(false,'Sync Error');
});
</script>
